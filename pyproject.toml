[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "robata"
version = "0.1.0"
description = "Executable contract foundation for the Robata six-camera pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "jsonschema>=4.23,<5",
  "pydantic>=2.10,<3",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
mcap = [
  "av>=14,<19",
  "mcap>=1.3,<2",
  "mcap-protobuf-support>=0.5,<1",
]
pgvector = [
  "psycopg[binary]>=3.2,<4",
]
r2 = [
  "boto3>=1.35,<2",
]
redis = [
  "redis>=5,<8",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "av>=14,<19",
  "fastapi>=0.115,<1",
  "hypothesis>=6.120,<7",
  "httpx>=0.27,<1",
  "mcap>=1.3,<2",
  "mcap-protobuf-support>=0.5,<1",
  "mypy>=1.14,<2",
  "Pillow>=11,<13",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "uvicorn[standard]>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/robata"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "acceptance: exercises optional dependencies and local real-data samples",
  "asyncio: runs a test coroutine under the pytest-asyncio event loop",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".agents",
  ".codex",
  "archive/old_mvp",
  "data",
  "tmp",
  "pytest-cache-files-*",
  ".claude",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/robata"]

# Owner: sampling adapter.
# Reason: NumPy is optional and absent from the core environment.
# Remove when it is a declared extra with typing or this module enters a runnable path.
[[tool.mypy.overrides]]
module = ["robata.sampling.signals", "numpy", "numpy.*"]
ignore_missing_imports = true

# Owner: storage adapter. SQLAlchemy is optional and absent from the core environment.
# Remove this exception when storage becomes a runnable, declared project extra.
[[tool.mypy.overrides]]
module = ["sqlalchemy", "sqlalchemy.*"]
ignore_missing_imports = true

# Owner: production transport adapter. Redis is an optional deployment dependency.
# Remove this exception when the Redis extra becomes a core runtime dependency.
[[tool.mypy.overrides]]
module = ["redis", "redis.*"]
ignore_missing_imports = true
