name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  live-tree:
    name: live-tree (shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      ROBATA_TEST_SHARD_INDEX: ${{ matrix.shard }}
      ROBATA_TEST_SHARD_TOTAL: 8
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.29'
          enable-cache: true

      - name: Sync locked development environment
        run: uv sync --locked --dev

      - name: Test live tree
        shell: pwsh
        run: >-
          uv run pytest -q -p no:cacheprovider
          --basetemp "$env:RUNNER_TEMP\robata-tests"

      - name: Lint and format check
        if: matrix.shard == 0
        run: |
          uv run ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Type check
        if: matrix.shard == 0
        run: uv run mypy

      - name: Verify schemas and documentation
        if: matrix.shard == 0
        run: |
          uv run python scripts/verify_schema_registry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/check_doc_links.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce published Schema immutability
        if: matrix.shard == 0
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          SCHEMA_BASELINE_REF: ${{ vars.SCHEMA_BASELINE_REF }}
        run: |
          $eventBaseline = if ($env:PR_BASE_SHA) { $env:PR_BASE_SHA } else { $env:PUSH_BEFORE_SHA }
          if (-not $eventBaseline -or $eventBaseline -match '^0+$') {
            throw 'The pull-request or push event did not provide a usable immutable baseline SHA.'
          }
          if ([string]::IsNullOrWhiteSpace($env:SCHEMA_BASELINE_REF)) {
            throw 'Repository variable SCHEMA_BASELINE_REF must name a protected release commit or tag.'
          }
          uv run python scripts/check_schema_immutability.py --baseline-ref $eventBaseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python scripts/check_schema_immutability.py --baseline-ref $env:SCHEMA_BASELINE_REF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build clean tracked-source evidence
        if: matrix.shard == 0
        shell: pwsh
        run: |
          $manifest = "$env:RUNNER_TEMP\robata-source-release-manifest.json"
          $archive = "$env:RUNNER_TEMP\robata-source-${{ github.sha }}.tar"
          uv run python scripts/check_release_hygiene.py --archive-output $archive --expected-commit "${{ github.sha }}" > $manifest

      - name: Publish source archive and manifest
        if: matrix.shard == 0
        uses: actions/upload-artifact@v7
        with:
          name: robata-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/robata-source-${{ github.sha }}.tar
            ${{ runner.temp }}/robata-source-release-manifest.json
          if-no-files-found: error
          retention-days: 14

  canonical-postgres:
    name: canonical-postgres
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: robata_ci
          POSTGRES_PASSWORD: robata_ci_password
          POSTGRES_USER: robata_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U robata_ci -d robata_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ROBATA_TEST_POSTGRES_DSN: postgresql://robata_ci:robata_ci_password@localhost:5432/robata_ci

    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pinned uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.29'
          enable-cache: true

      - name: Sync locked PostgreSQL test environment
        run: uv sync --locked --dev --extra pgvector

      - name: Test canonical PostgreSQL adapters
        run: >-
          uv run pytest -q -p no:cacheprovider
          tests/integration/test_postgres_work_authority_integration.py
          tests/integration/test_postgres_completion_evidence.py
          tests/integration/test_postgres_logical_review_integration.py
          tests/integration/test_postgres_read_model_integration.py
          tests/integration/test_postgres_production_roles.py

  quality:
    name: quality
    needs: [live-tree, canonical-postgres]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every live-tree shard and canonical PostgreSQL job
        env:
          LIVE_TREE_RESULT: ${{ needs.live-tree.result }}
          CANONICAL_POSTGRES_RESULT: ${{ needs.canonical-postgres.result }}
        run: |
          test "$LIVE_TREE_RESULT" = "success"
          test "$CANONICAL_POSTGRES_RESULT" = "success"
